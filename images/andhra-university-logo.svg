<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220">
  <defs>
    <linearGradient id="snakeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B0000"/>
      <stop offset="50%" style="stop-color:#CD5C5C"/>
      <stop offset="100%" style="stop-color:#8B0000"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#DAA520"/>
    </linearGradient>
  </defs>
  
  <!-- Shield Background -->
  <path d="M100 10 L170 30 Q180 35 180 50 L180 140 Q180 180 100 210 Q20 180 20 140 L20 50 Q20 35 30 30 Z" 
        fill="#FFF8DC" stroke="#8B4513" stroke-width="3"/>
  
  <!-- Left Snake/Cobra -->
  <path d="M25 45 Q15 60 20 80 Q25 100 22 120 Q18 140 25 160 Q30 175 35 180 
           Q40 175 38 160 Q35 140 40 120 Q45 100 42 80 Q38 60 45 50 Q40 45 35 48 Q30 42 25 45" 
        fill="url(#snakeGrad)" stroke="#5C1010" stroke-width="1"/>
  <!-- Left cobra hood -->
  <ellipse cx="30" cy="42" rx="12" ry="8" fill="url(#snakeGrad)" stroke="#5C1010" stroke-width="1"/>
  <circle cx="28" cy="40" r="2" fill="#FFD700"/>
  
  <!-- Right Snake/Cobra -->
  <path d="M175 45 Q185 60 180 80 Q175 100 178 120 Q182 140 175 160 Q170 175 165 180 
           Q160 175 162 160 Q165 140 160 120 Q155 100 158 80 Q162 60 155 50 Q160 45 165 48 Q170 42 175 45" 
        fill="url(#snakeGrad)" stroke="#5C1010" stroke-width="1"/>
  <!-- Right cobra hood -->
  <ellipse cx="170" cy="42" rx="12" ry="8" fill="url(#snakeGrad)" stroke="#5C1010" stroke-width="1"/>
  <circle cx="172" cy="40" r="2" fill="#FFD700"/>
  
  <!-- Central Circle Border -->
  <circle cx="100" cy="95" r="55" fill="none" stroke="url(#goldGrad)" stroke-width="8"/>
  <circle cx="100" cy="95" r="48" fill="#1a0a00" stroke="#DAA520" stroke-width="2"/>
  
  <!-- Sun Rays -->
  <g fill="#FF6B00">
    <polygon points="100,50 103,65 97,65"/>
    <polygon points="100,140 103,125 97,125"/>
    <polygon points="55,95 70,92 70,98"/>
    <polygon points="145,95 130,92 130,98"/>
    <polygon points="68,63 80,72 76,78"/>
    <polygon points="132,63 120,72 124,78"/>
    <polygon points="68,127 80,118 76,112"/>
    <polygon points="132,127 120,118 124,112"/>
  </g>
  
  <!-- Inner decorative circle -->
  <circle cx="100" cy="95" r="35" fill="#2d1810" stroke="#FFD700" stroke-width="2"/>
  
  <!-- Lotus Symbol -->
  <ellipse cx="100" cy="105" rx="18" ry="10" fill="#FFF5EE"/>
  <path d="M100 75 Q95 85 90 95 Q95 90 100 88 Q105 90 110 95 Q105 85 100 75" fill="#FF6347"/>
  <path d="M85 95 Q90 90 95 95 Q90 100 85 95" fill="#FFF5EE"/>
  <path d="M115 95 Q110 90 105 95 Q110 100 115 95" fill="#FFF5EE"/>
  <path d="M100 95 L100 110" stroke="#228B22" stroke-width="2"/>
  
  <!-- Swastika symbol at top (auspicious Hindu symbol) -->
  <g transform="translate(100, 25)" fill="#FF6B00" stroke="#FF6B00" stroke-width="1.5">
    <line x1="-6" y1="0" x2="6" y2="0"/>
    <line x1="0" y1="-6" x2="0" y2="6"/>
    <line x1="6" y1="0" x2="6" y2="-4"/>
    <line x1="-6" y1="0" x2="-6" y2="4"/>
    <line x1="0" y1="-6" x2="4" y2="-6"/>
    <line x1="0" y1="6" x2="-4" y2="6"/>
  </g>
  
  <!-- Telugu Text: ఆంధ్ర విశ్వవిద్యాలయ -->
  <text x="100" y="175" font-family="Arial, sans-serif" font-size="14" fill="#8B4513" text-anchor="middle" font-weight="bold">ఆంధ్రవిశ్వకళా</text>
  <text x="100" y="195" font-family="Arial, sans-serif" font-size="14" fill="#8B4513" text-anchor="middle" font-weight="bold">పరిషత్</text>
</svg>
